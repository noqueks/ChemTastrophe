<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ChemTastrophe World</title><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#10131c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:ui-monospace,Menlo,Consolas,monospace}
body{position:relative;color:#fff}
#c{position:absolute;inset:0;margin:auto;object-fit:contain;image-rendering:pixelated}
.b{position:absolute;width:64px;height:64px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff66;color:#fff;font:bold 12px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
#stick{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#ffffffaa;pointer-events:none}
#mb{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:8px;z-index:4;width:38px;height:32px;border-radius:0;border:2px solid #f8d038;background:#142b6c;color:#fff;font-size:16px;box-shadow:0 2px 0 #3a2600}
body:not(.inplay) #stick,body:not(.inplay) .b,body:not(.inplay) #mb{display:none}
#ui{position:absolute;inset:0;pointer-events:none;z-index:6}
#hint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:12px;color:#fffc;z-index:9;pointer-events:none;text-shadow:0 1px 2px #000}
.ov{position:absolute;inset:0;background:#0b0e17f2;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px;padding:10px 10px 26px;overflow:auto;pointer-events:auto}
.ov.clear{background:transparent;pointer-events:none}.ov.clear .menu{pointer-events:auto}
.ov h2{margin:0;color:#ffd54a;letter-spacing:2px}.ov h3{margin:10px 0 2px;color:#8ccaff;font-size:13px}
.ov p{margin:0;font-size:12px;color:#fffa;text-align:center;max-width:560px}.ov p.big{font-size:15px;color:#fff;line-height:1.4}.dim{color:#fff7}.good{color:#9cff9c!important}.warn{color:#ff8a80!important}
.menu{position:absolute;left:50%;top:33%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px}
.mbtn{min-width:min(280px,82vw);padding:9px 14px;border:3px solid #1b0f2e;background:#3a2358;color:#fff;font:bold 14px ui-monospace,monospace;letter-spacing:1px;box-shadow:0 4px 0 #000;cursor:pointer;text-align:center}
.mbtn:disabled{opacity:.35}
.sel{background:#ffd54a!important;color:#1b1b2f!important;animation:blk .6s steps(2) infinite}
.sel button{color:#1b1b2f}.mbtn.sel::before{content:'► '}.mbtn.sel::after{content:' ◄'}
@keyframes blk{50%{filter:brightness(1.25)}}.reduce *{animation:none!important;transition:none!important}
#sl{width:min(560px,94vw);max-height:calc(100vh - 150px);overflow-y:scroll;padding:0 12px 0 4px;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-color:#ffd54a #ffffff22}
#sl::-webkit-scrollbar{width:10px}#sl::-webkit-scrollbar-track{background:#ffffff22;border-radius:6px}#sl::-webkit-scrollbar-thumb{background:#ffd54a;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border:2px solid #ffffff22;margin:3px 0;font-size:13px}
.row button,.krow button{background:#ffffff18;color:#fff;border:2px solid #ffffff55;padding:4px 10px;font:bold 12px ui-monospace,monospace;cursor:pointer;min-width:90px}
.row input[type=range]{width:150px;vertical-align:middle}.row b{display:inline-block;min-width:44px;text-align:right}
.krow{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:6px;align-items:center;margin:3px 0;font-size:13px}.krow.head{color:#8ccaff;font-weight:bold}
.krow button.dup{outline:2px solid #ff5252}.krow button.sel{background:#ffd54a;color:#1b1b2f}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tg span{border:2px solid #ffffff33;padding:6px 10px;font-size:12px}.tg span.on{background:#4fd36b;color:#10231a;border-color:#fff}
.mbtn{transition:transform .08s}.mbtn.sel{transform:scale(1.07)}#fade{position:absolute;inset:0;background:#0b0e17;opacity:0;pointer-events:none;z-index:20}
.axb{width:280px;height:12px;border:2px solid #fff6;position:relative}.axb i{position:absolute;top:0;width:10px;height:12px;background:#ffd54a;margin-left:-5px;left:50%}
</style></head><body>
<canvas id="c" width="640" height="360"></canvas>
<div id="stick"><div id="knob"></div></div>
<div class="b" data-k="y" style="right:166px;bottom:calc(14px + env(safe-area-inset-bottom,0px))">CORRE</div>
<div class="b" data-k="s" style="right:90px;bottom:calc(40px + env(safe-area-inset-bottom,0px))">GIRO</div>
<div class="b" data-k="j" style="right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))">PULO</div>
<div class="b" data-k="a" style="right:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px))">ATQ</div>
<div class="b" data-k="i" style="right:166px;bottom:calc(84px + env(safe-area-inset-bottom,0px))">USAR</div>
<button id="mb">☰</button>
<div id="ui"></div><div id="hint"></div><div id="fade"></div>
<script>
// core.js — canvas, barramento de eventos e atalhos globais
const cv=document.getElementById('c'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
const Events={h:{},on(e,f){(this.h[e]=this.h[e]||[]).push(f)},emit(e,d){(this.h[e]||[]).forEach(f=>f(d))}};

// SettingsManager.js — configurações centralizadas, comandos padrão e tela/escala
// [id, nome, contexto]  contexto: 'play' (jogo) ou 'menu' (navegação)
const ACTIONS=[['left','Esquerda','play'],['right','Direita','play'],['up','Olhar para cima','play'],['down','Agachar','play'],['jump','Pular','play'],['spin','Giro','play'],['run','Correr','play'],['attack','Atacar / habilidade','play'],['interact','Interagir (portais)','play'],['pause','Pausar','play'],['confirm','Confirmar (menus)','menu'],['back','Voltar (menus)','menu']];
const KB_DEF={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],jump:['KeyZ','Space'],spin:['KeyX'],run:['ShiftLeft','KeyC'],attack:['KeyV'],interact:['KeyE'],pause:['Escape','KeyP'],confirm:['Enter'],back:['Backspace']};
const GP_DEF={left:[14],right:[15],up:[12],down:[13],jump:[0],spin:[2],run:[1,7],attack:[3,5],interact:[4],pause:[9],confirm:[0],back:[1]};
const DEF={master:.7,music:.5,sfx:.8,power:.8,enemy:.8,vib:1,vibInt:.7,dead:.15,sens:1,scale:'fit',pix:1,reduce:0,ui:{sw:0,sz:1,op:1,hud:1},kb:KB_DEF,gp:GP_DEF};
const clone=o=>JSON.parse(JSON.stringify(o));
const Settings={KEY:'ctw.settings.v2',d:clone(DEF),
 load(){try{const s=JSON.parse(localStorage.getItem(this.KEY));if(s){for(const k in s){if(k=='ui'||k=='kb'||k=='gp')Object.assign(this.d[k],s[k]);else if(k in DEF)this.d[k]=s[k]}}else this.migrate()}catch(e){}},
 migrate(){try{const V=JSON.parse(localStorage.getItem('ctw')||'null'),C=JSON.parse(localStorage.getItem('ctw2')||'null');if(V){this.d.master=V.m;this.d.power=V.p;this.d.enemy=V.e;this.d.music=V.b}if(C)Object.assign(this.d.ui,C)}catch(e){}},
 save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.d))}catch(e){}},
 set(k,v){this.d[k]=v;this.save();Events.emit('settings',k)},
 resetAll(){this.d=clone(DEF);this.save();Events.emit('settings','all')},
 resetBinds(){this.d.kb=clone(KB_DEF);this.d.gp=clone(GP_DEF);this.save();Events.emit('settings','binds')},
 // ações do mesmo contexto que já usam este código (aviso de duplicidade)
 conflicts(type,a,code){const ctx=ACTIONS.find(x=>x[0]==a)[2];return ACTIONS.filter(x=>x[0]!=a&&x[2]==ctx&&this.d[type][x[0]].includes(code)).map(x=>x[1])}};
const Display={apply(){const s=Settings.d;cv.style.imageRendering=s.pix?'pixelated':'auto';
  const n=s.scale=='int'?Math.max(1,Math.floor(Math.min(innerWidth/640,innerHeight/360))):s.scale=='2x'?2:s.scale=='3x'?3:0;
  cv.style.width=n?640*n+'px':'100%';cv.style.height=n?360*n+'px':'100%'},
 fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}};

// GamepadManager.js — Gamepad API: conexão, tipo de controle, ícones e vibração
const Pad={idx:-1,type:'none',name:'',b:[],ax:[0,0,0,0],
 NAMES:{xbox:'Xbox',ps:'PlayStation',switch:'Nintendo',generic:'Genérico',none:'Nenhum'},
 L:{xbox:['A','B','X','Y','LB','RB','LT','RT','View','Menu','L3','R3','↑','↓','←','→','Home'],
    ps:['✕','○','□','△','L1','R1','L2','R2','Share','Options','L3','R3','↑','↓','←','→','PS'],
    switch:['B','A','Y','X','L','R','ZL','ZR','−','+','L3','R3','↑','↓','←','→','Home']},
 detect(id){id=id.toLowerCase();if(/054c|playstation|dualshock|dualsense|sony/.test(id))return'ps';if(/xbox|045e|xinput/.test(id))return'xbox';if(/057e|nintendo|switch/.test(id))return'switch';return'generic'},
 pick(p){this.idx=p.index;this.name=p.id;this.type=this.detect(p.id)},
 init(){addEventListener('gamepadconnected',e=>{this.pick(e.gamepad);Events.emit('padchange')});
  addEventListener('gamepaddisconnected',e=>{if(e.gamepad.index==this.idx){this.idx=-1;this.type='none';this.name='';this.b=[];Events.emit('padchange')}})},
 poll(){const gs=navigator.getGamepads?navigator.getGamepads():[];let p=gs[this.idx];
  if(!p||!p.connected){p=null;for(const x of gs)if(x&&x.connected){this.pick(x);p=x;Events.emit('padchange');break}}
  if(!p){this.b=[];this.ax=[0,0,0,0];return false}
  this.b=p.buttons.map(x=>x.pressed||x.value>.5);this.ax=[p.axes[0]||0,p.axes[1]||0,p.axes[2]||0,p.axes[3]||0];return true},
 label(i){const l=this.L[this.type];return l&&l[i]!==undefined?l[i]:'Botão '+i},
 rumble(ms,w,s){const S=Settings.d;if(!S.vib||this.idx<0)return;try{const p=navigator.getGamepads()[this.idx],a=p&&p.vibrationActuator;
  if(a&&a.playEffect)a.playEffect('dual-rumble',{duration:ms,weakMagnitude:Math.min(1,w*S.vibInt*1.4),strongMagnitude:Math.min(1,s*S.vibInt*1.4)});
  else if(p&&p.hapticActuators&&p.hapticActuators[0])p.hapticActuators[0].pulse(S.vibInt,ms)}catch(e){}}};

// InputManager.js — teclado + controle + toque unificados em AÇÕES remapeáveis
const KNAME={Space:'Espaço',ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',ShiftLeft:'Shift',ShiftRight:'Shift D',ControlLeft:'Ctrl',Escape:'Esc',Backspace:'Backspace',Enter:'Enter'};
const kname=c=>KNAME[c]||String(c).replace(/^(Key|Digit)/,'').replace('Numpad','Num ');
const BLOCK=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Tab','Backspace','Enter']);
const Input={keys:{},T:{ax:0,u:0,d:0,j:0,s:0,y:0,a:0,i:0},act:{},prev:{},press:{},pn:{},hold:{},ax:0,device:'kb',capt:null,
 setDev(d){if(this.device!=d){this.device=d;Events.emit('device',d)}},
 init(){
  addEventListener('keydown',e=>{Events.emit('gesture');
   if(this.capt&&this.capt.t=='kb'){e.preventDefault();if(!e.repeat){const f=this.capt.f;this.capt=null;f(e.code)}return}
   if(BLOCK.has(e.code))e.preventDefault();this.keys[e.code]=1;this.setDev('kb')});
  addEventListener('keyup',e=>{delete this.keys[e.code]});addEventListener('blur',()=>{this.keys={}});
  addEventListener('pointerdown',e=>{Events.emit('gesture');this.setDev(e.pointerType=='mouse'?'kb':'touch')},true);
  // ----- toque: analógico virtual + botões -----
  const st=$('stick'),kn=$('knob'),T=this.T;let sid=null;
  const mv=e=>{const r=st.getBoundingClientRect(),sc=Settings.d.ui.sz;let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const R=46*sc,d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}
   kn.style.transform=`translate(${dx/sc}px,${dy/sc}px)`;T.ax=dx/R;T.d=dy>24*sc?1:0;T.u=dy<-24*sc?1:0};
  st.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;st.setPointerCapture(sid);mv(e)});
  st.addEventListener('pointermove',e=>{if(e.pointerId==sid)mv(e)});
  const up=e=>{if(e.pointerId==sid){sid=null;T.ax=T.u=T.d=0;kn.style.transform=''}};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  document.querySelectorAll('.b').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();T[k]=1});
   ['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>T[k]=0));b.addEventListener('contextmenu',e=>e.preventDefault())});
  document.querySelectorAll('.b').forEach(b=>b.dataset.r=parseInt(b.style.right));this.layoutTouch()},
 layoutTouch(){const u=Settings.d.ui,o=u.sw,sc='scale('+u.sz+')',st=$('stick');
  st.style.left=o?'auto':'18px';st.style.right=o?'18px':'auto';st.style.transformOrigin=o?'bottom right':'bottom left';st.style.transform=sc;st.style.opacity=u.op;
  document.querySelectorAll('.b').forEach(b=>{const r=b.dataset.r+'px';b.style.left=o?r:'auto';b.style.right=o?'auto':r;b.style.transformOrigin=o?'bottom left':'bottom right';b.style.transform=sc;b.style.opacity=u.op})},
 capture(type,f){this.capt={t:type,f,ts:Date.now(),base:null}},
 update(){const S=Settings.d,on=Pad.poll(),B=Pad.b,A=Pad.ax,T=this.T,K=this.keys,playing=state=='play',navOn=!playing&&!this.capt&&!UI.testing;
  const kd=a=>S.kb[a].some(c=>K[c]),bd=a=>on&&S.gp[a].some(i=>B[i]);
  const m=Math.hypot(A[0],A[1]);let px=0,py=0;if(m>S.dead){const k=Math.min(1,(m-S.dead)/(1-S.dead)*S.sens);px=A[0]/m*k;py=A[1]/m*k}
  const act={};for(const[a]of ACTIONS)act[a]=kd(a)||bd(a);
  act.jump=act.jump||!!T.j;act.spin=act.spin||!!T.s;act.run=act.run||!!T.y;act.attack=act.attack||!!T.a;act.interact=act.interact||!!T.i;
  act.up=act.up||py<-.5||!!T.u;act.down=act.down||py>.5||!!T.d;
  const lr=(act.right?1:0)-(act.left?1:0);this.ax=Math.max(-1,Math.min(1,[lr,px,T.ax].reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a,0)));
  if(on&&(B.some(Boolean)||Math.abs(A[0])>.6||Math.abs(A[1])>.6)){this.setDev('pad');Events.emit('gesture')}
  const pr={};for(const a in act)pr[a]=act[a]&&!this.prev[a];this.act=act;this.press=pr;this.prev=act;   // pr = borda de subida (anti-repetição)
  const c=this.capt;
  if(c&&c.t=='gp'){if(Date.now()-c.ts>6000){this.capt=null;c.f(null)}else{c.base=c.base||B.map(Boolean);for(let i=0;i<B.length;i++){if(B[i]&&!c.base[i]){this.capt=null;c.f(i);break}c.base[i]=c.base[i]&&B[i]}}}
  else if(c&&Date.now()-c.ts>6000){this.capt=null;c.f(null)}
  // navegação de menus: comandos fixos (setas/Enter/Esc e direcional/A/B) SEMPRE funcionam, mesmo após remapear
  const F=x=>!!K[x],now=performance.now();
  const raw={up:act.up||F('ArrowUp')||(on&&B[12])||py<-.5,down:act.down||F('ArrowDown')||(on&&B[13])||py>.5,left:act.left||F('ArrowLeft')||(on&&B[14])||px<-.5,right:act.right||F('ArrowRight')||(on&&B[15])||px>.5,
   confirm:act.confirm||F('Enter')||(on&&B[0]),back:act.back||F('Escape')||(on&&B[1])};
  for(const d in raw){const v=!!raw[d];
   if(d=='confirm'||d=='back'){if(v&&!this.pn[d]&&navOn)Events.emit('nav',d)}
   else{const h=this.hold[d]||0;if(v){if(!h){if(navOn)Events.emit('nav',d);this.hold[d]=now+380}else if(now>h){if(navOn)Events.emit('nav',d);this.hold[d]=now+110}}else this.hold[d]=0}
   this.pn[d]=v}
  if(playing&&pr.pause)Events.emit('pause')},   // 'playing' = estado no início do quadro (Esc não pausa e despausa no mesmo quadro)
 apply(Kg){const a=this.act;Kg.ax=this.ax;Kg.u=a.up?1:0;Kg.d=a.down?1:0;Kg.j=a.jump?1:0;Kg.s=a.spin?1:0;Kg.y=a.run?1:0;Kg.a=a.attack?1:0;Kg.i=a.interact?1:0},
 rumble(ms,w,s){Pad.rumble(ms,w,s)},
 label(a){const S=Settings.d;if(this.device=='pad'&&Pad.idx>=0)return Pad.label(S.gp[a][0]);if(this.device=='touch')return{confirm:'Toque',back:'☰'}[a]||a;return kname(S.kb[a][0])}};

// AudioManager.js — chiptune procedural (melodias originais), barramentos de volume, pausa/retomada
const SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],pen:[0,2,4,7,9,11,12]};
const tk=s=>s.split(' ').map(x=>x=='.'?null:+x);
const TR={ // bpm, escala, tônica (MIDI), ondas, melodia (1 passo = 1/16), baixo (bs passos por nota)
 menu:{bpm:112,sc:'maj',root:60,w:'square',bw:'triangle',bs:4,mel:tk('0 2 4 7 4 2 0 . 3 5 7 9 7 5 3 . 4 2 0 2 4 7 9 7 4 2 0 . -3 . 0 .'),bass:tk('-7 -7 -4 -5 -7 -7 -4 -3')},
 world0:{bpm:146,sc:'min',root:57,w:'square',bw:'triangle',bs:4,mel:tk('0 . 2 3 . 4 3 2 0 . -2 . 0 2 3 . 4 . 5 4 3 . 2 3 0 . . 2 3 . 2 .'),bass:tk('-7 -7 -5 -4 -7 -7 -3 -4')},
 world1:{bpm:118,sc:'maj',root:62,w:'triangle',bw:'square',bs:4,mel:tk('4 . 2 . 0 2 4 . 5 . 4 . 2 . 0 . -1 . 0 . 2 . 4 7 4 . 2 . 0 . . .'),bass:tk('-7 -4 -5 -3 -7 -4 -2 -5')},
 world2:{bpm:132,sc:'pen',root:60,w:'square',bw:'triangle',bs:4,mel:tk('0 1 2 3 4 3 2 1 2 3 4 5 6 5 4 . 3 2 1 2 3 4 3 2 1 0 . 1 2 . 0 .'),bass:tk('-7 -7 -6 -5 -7 -7 -4 -5')},
 world3:{bpm:100,sc:'min',root:55,w:'square',bw:'triangle',bs:4,mel:tk('0 . . 2 . . 3 . 4 . . 3 . 2 . . 0 . . 2 . . 4 . 5 . . 4 . 3 . .'),bass:tk('-7 -7 -3 -3 -5 -5 -4 -4')},
 boss:{bpm:168,sc:'min',root:52,w:'square',bw:'square',bs:2,mel:tk('0 0 3 0 5 0 3 0 0 0 3 0 6 5 3 . 7 7 5 7 3 7 5 7 6 5 3 2 3 . . .'),bass:tk('-7 -7 -7 -5 -7 -7 -4 -5 -7 -7 -7 -5 -3 -4 -5 -6')},
 win:{bpm:150,sc:'maj',root:67,w:'square',bw:'triangle',bs:4,mel:tk('0 2 4 7 . 4 7 9 7 . . . 4 2 0 . 2 4 7 9 11 9 7 . 12 . 9 7 4 . 0 .'),bass:tk('-7 -4 -5 -7 -4 -3 -5 -7')},
 lose:{bpm:72,sc:'min',root:55,w:'triangle',bw:'triangle',bs:4,once:1,mel:tk('4 . 3 . 2 . 0 . -1 . . . . . . .'),bass:tk('-7 -5 -7 -7')}};
TR.world4={...TR.world0,bpm:156,root:52,sc:'pen'};
const AudioMgr={ctx:null,bus:{},want:null,cur:null,
 init(){if(this.ctx)return;try{const c=this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.bus.master=c.createGain();
   ['music','sfx','power','enemy'].forEach(k=>{this.bus[k]=c.createGain();this.bus[k].connect(this.bus.master)});this.bus.master.connect(c.destination);
   this.applyVol();setInterval(()=>this.tick(),30);if(this.want){const w=this.want;this.want=null;this.procPlay(w)}}catch(e){this.ctx=null}},
 applyVol(){if(!this.ctx)return;const S=Settings.d,b=this.bus;b.master.gain.value=S.master;b.music.gain.value=S.music*.6;b.sfx.gain.value=S.sfx;b.power.gain.value=S.power;b.enemy.gain.value=S.enemy},
 playMusic(n){if(!this.ctx){this.want=n;return}if(this.cur&&this.cur.n==n)return;const c=this.ctx;
  if(this.cur){const o=this.cur;o.g.gain.setTargetAtTime(0,c.currentTime,.06);setTimeout(()=>o.g.disconnect(),500)}
  const g=c.createGain();g.connect(this.bus.music);this.cur={n,g,i:0,t:c.currentTime+.06,T:TR[n]||TR.world3}},
 pause(){if(this.ctx)this.ctx.suspend()},resume(){if(this.ctx)this.ctx.resume()},
 deg(T,d){const o=Math.floor(d/7),i=((d%7)+7)%7;return T.root+SC[T.sc][i]+12*o},

Object.assign(AudioMgr,{procPlay:AudioMgr.playMusic,name:null,el:{},bad:{},pend:null,
 fv(){const S=Settings.d;return Math.min(1,S.master*S.music*1.4)},          // volume da música: independente dos efeitos (S.sfx/power/enemy)
 syncVol(){for(const n in this.el){const a=this.el[n];a.volume=Math.max(0,Math.min(1,(a._m||0)*this.fv()))}},
 file(n){if(!MUS[n]||this.bad[n])return null;let a=this.el[n];
  if(!a){try{a=this.el[n]=new Audio('assets/audio/'+MUS[n]);a.loop=n!='bossvic';a.preload='auto';a._m=0;a.volume=0;
   a.addEventListener('error',()=>{this.bad[n]=1;console.warn('[Audio] não foi possível carregar',MUS[n],'— usando chiptune de reserva');if(this.name==n){this.name=null;this.playMusic(n)}})}catch(e){this.bad[n]=1;return null}}
  return a},
 fade(a,to,ms,cb){clearInterval(a._f);const from=a._m||0,t0=performance.now();
  a._f=setInterval(()=>{const k=ms<=0?1:Math.min(1,(performance.now()-t0)/ms);a._m=from+(to-from)*k;a.volume=Math.max(0,Math.min(1,a._m*this.fv()));if(k>=1){clearInterval(a._f);cb&&cb()}},40)},
 fadeOut(a,ms){this.fade(a,0,ms,()=>{try{a.pause()}catch(e){}})},
 startEl(a){if(this.paused)return;try{const p=a.play();if(p&&p.catch)p.catch(()=>{this.pend=this.name})}catch(e){this.pend=this.name}},
 procStop(){if(this.cur&&this.ctx){const o=this.cur,c=this.ctx;o.g.gain.setTargetAtTime(0,c.currentTime,.15);setTimeout(()=>o.g.disconnect(),1200)}this.cur=null;this.want=null},
 playMusic(n,ms){if(this.name===n)return;const prev=this.name,f=this.file(n);this.name=n;ms=ms||800;   // mesma faixa = não reinicia
  const pe=prev&&this.el[prev];if(pe&&pe!==f)this.fadeOut(pe,ms);
  if(f){this.procStop();if(f.paused)f.currentTime=0;this.startEl(f);this.fade(f,1,ms)}
  else{this.procPlay(MUS_FALLBACK[n]||n)}},
 stopMusic(ms){const a=this.el[this.name];if(a)this.fadeOut(a,ms||1000);this.procStop();this.name=null},   // fade-out sem trocar de faixa
 pause(){this.paused=1;if(this.ctx)this.ctx.suspend();for(const n in this.el)try{this.el[n].pause()}catch(e){}},
 resume(){this.paused=0;if(this.ctx)this.ctx.resume();const a=this.el[this.name];if(a)this.startEl(a)},
 retry(){if(this.pend&&this.name){this.pend=null;const a=this.el[this.name];if(a)this.startEl(a)}}   // política de autoplay: tenta de novo no 1º gesto
});
{const av=AudioMgr.applyVol;AudioMgr.applyVol=function(){av.call(this);this.syncVol()}}

// ===== Chefes das fases: comportamento único por tipo. Ciclo: MOVER -> AVISO -> ATAQUE -> RECUPERAR (st 0..3) =====
// 0 Ácido: salvas de projéteis corrosivos | 1 Base: golpes fortes e lentos | 2 Sal: cristais caindo do céu | 3 Óxido: investidas rápidas
// mv=[min,max] ticks movendo; tl=aviso; at=ataque; rc=recuperação (janela para pisar na cabeça). Com hp<=2 todos ficam mais agressivos.
const BA=[{mv:[70,110],tl:28,at:30,rc:45},{mv:[90,130],tl:48,at:14,rc:60},{mv:[60,90],tl:20,at:150,rc:40},{mv:[50,80],tl:32,at:90,rc:45}];
function bSt(b,s){const A=BA[cw];b.st=s;b.sc=0;if(s==0)b.dash=0;b.dl=s==0?(A.mv[0]+Math.random()*(A.mv[1]-A.mv[0]))|0:[0,A.tl,A.at,A.rc][s];if(s==1){b.fc=P.x<b.x?-1:1;b.vx=0}}
function bMove(b,sp){b.vx=(b.vx<0?-1:1)*sp;if(b.x<b.a)b.vx=sp;if(b.x>b.b)b.vx=-sp;b.x+=b.vx;b.fc=b.vx<0?-1:1}
function bossAI(b){const A=BA[cw],hi=b.hp<=2,gnd=b.y>=GY-b.h,AL=LW-760,AR=LW,cx=b.x+b.w/2;
 if(b.dl==null)bSt(b,0);
 b.sc++;
 if(b.st==0){
  if(cw==0){bMove(b,1.1);if(gnd&&b.sc==(b.dl>>1))b.vy=-9}
  else if(cw==1){b.fc=P.x<b.x?-1:1;if(Math.abs(P.x-cx)>50)b.x+=b.fc*.7}
  else if(cw==2){bMove(b,1);if(gnd&&b.sc%48==24)b.vy=-8}
  else bMove(b,2.3);
  if(b.sc>=b.dl||(cw==1&&b.sc>40&&Math.abs(P.x-cx)<80))bSt(b,1)}
 else if(b.st==1){
  if(cw==0)b.fc=P.x<b.x?-1:1;
  if(cw==3&&b.sc%4==0)burst(cx-b.fc*14,GY-3,2,['#c63','#fa5','#8a4'],1.2);   // poeira: ele se prepara para investir
  if(b.sc>=(hi&&(cw==1||cw==3)?A.tl-12:A.tl))bSt(b,2)}
 else if(b.st==2){
  if(cw==0){   // Ácido: leque de glóbulos em arco; cada um vira uma poça ao cair
   if(b.sc==1||(hi&&b.sc==16)){const n=hi?5:3;for(let i=0;i<n;i++)bshots.push({k:'ac',x:cx-6,y:b.y+8,w:12,h:12,vx:b.fc*(1.6+i*(hi?.9:1.2)),vy:-5.5-(i%2)*(b.sc>1?1.5:1),g:.15,l:240});snd('f')}}
  else if(cw==1){   // Base: pancada pesada à frente + onda de choque no chão
   const box={x:b.fc>0?b.x+b.w-6:b.x-50,y:GY-48,w:56,h:48};
   if(b.sc==1){snd('e');burst(b.fc>0?b.x+b.w+10:b.x-10,GY-6,14,['#4af','#8cf','#fff'],2.4);
    for(const d of hi?[-1,1]:[b.fc])bshots.push({k:'sw',x:d>0?b.x+b.w:b.x-26,y:GY-20,w:26,h:20,vx:d*3.4,vy:0,g:0,l:90})}
   if(b.sc<=10&&hit(P,box)&&!P.inv){hurt();P.vx=b.fc*6;P.vy=-6}}
  else if(cw==2){   // Sal: cristais com marcação no chão (aviso) antes de despencar
   if(b.sc%(hi?13:17)==1){const x=Math.max(AL+10,Math.min(AR-40,P.x+Math.random()*120-60));bshots.push({k:'cr',x,y:-30,w:14,h:22,vx:0,vy:0,g:.3,vm:7,l:220,wt:36,sh:hi})}}
  else{   // Óxido: investida em linha reta até a parede
   const v=b.fc*(hi?8.5:7.5);b.x+=v;if(b.sc%3==0)burst(cx-b.fc*18,GY-4,3,['#c63','#fa5','#8a4'],1.5);
   if((b.x<=AL&&b.fc<0)||(b.x>=AR-b.w-6&&b.fc>0)){burst(cx+b.fc*20,b.y+b.h/2,14,['#f2784b','#fa5','#fff'],3);snd('e');b.sc=A.at}}
  if(b.sc>=b.dl){if(cw==3&&hi&&!b.dash){b.dash=1;bSt(b,1);b.sc=8}else bSt(b,3)}}
 else{if(b.sc>=b.dl)bSt(b,0)}   // recuperando: parado e vulnerável
 b.x=Math.max(AL,Math.min(AR-b.w-6,b.x))}
function drawBShot(q){g.save();const cx=q.x+q.w/2,cy=q.y+q.h/2;
 if(q.k=='ac'){g.globalAlpha=q.pd?.55+.15*Math.sin(Date.now()/90):.95;g.fillStyle=q.pd?'#7c2':'#9f3';g.beginPath();if(q.pd)g.ellipse(cx,q.y+q.h-2,q.w/2,q.h/2+1,0,0,7);else g.arc(cx,cy,7,0,7);g.fill();g.strokeStyle='#cf6';g.stroke()}
 else if(q.k=='sw'){g.fillStyle='#4af';g.strokeStyle='#fff';g.beginPath();g.moveTo(q.x,q.y+q.h);g.lineTo(cx+(q.vx<0?-6:6),q.y);g.lineTo(q.x+q.w,q.y+q.h);g.closePath();g.fill();g.stroke()}
 else if(q.k=='cr'){if(q.wt>0){g.globalAlpha=.35+.35*Math.sin(Date.now()/60);g.fillStyle='#e8d';g.fillRect(cx-1,0,2,GY);g.beginPath();g.moveTo(cx-9,GY);g.lineTo(cx,GY-8);g.lineTo(cx+9,GY);g.fill()}
  else{g.fillStyle='#e8d';g.strokeStyle='#fff';g.beginPath();g.moveTo(cx,q.y);g.lineTo(q.x+q.w,cy);g.lineTo(cx,q.y+q.h);g.lineTo(q.x,cy);g.closePath();g.fill();g.stroke()}}
 else{g.fillStyle='#b8f';g.fillRect(q.x,q.y,q.w,q.h)}
 g.restore()}
function drawBossFx(b){if(!b.on)return;g.save();const cx=b.x+b.w/2,t=Date.now();
 if(b.st==1){g.globalAlpha=.25+.2*Math.sin(t/50);g.fillStyle=cw==0?'#9f3':cw==1?'#f55':cw==2?'#e8d':'#fa5';g.beginPath();g.arc(cx,b.y+b.h/2,42,0,7);g.fill();
  if(cw==1){g.globalAlpha=.18;g.fillStyle='#f33';g.fillRect(b.fc>0?b.x+b.w-6:b.x-50,GY-48,56,48)}   // zona do golpe
  if(cw==3){g.globalAlpha=.2;g.fillStyle='#fa5';g.fillRect(b.fc>0?cx:LW-760,GY-30,b.fc>0?LW-cx:cx-(LW-760),30)}}   // trajeto da investida

 g.restore()}

// ---- validador de alcançabilidade (conservador: sem correr) usado nos testes ----
function RoomCheck(n){const B=RB[n.rk](n),sf=[],bad=[];B.sol.forEach(s=>{if(s.mv){const m=s.mv;if(m.ax=='x'){sf.push({x0:m.a,x1:m.a+s.w,y:s.y,m:s},{x0:m.b,x1:m.b+s.w,y:s.y,m:s})}else{sf.push({x0:s.x,x1:s.x+s.w,y:m.a,m:s},{x0:s.x,x1:s.x+s.w,y:m.b,m:s})}}else sf.push({x0:s.x,x1:s.x+s.w,y:s.y})});
 const can=(A,C)=>{if(A.m&&A.m===C.m)return true;const gap=Math.max(0,C.x0-A.x1,A.x0-C.x1),dy=A.y-C.y;return dy>=0?(dy<=90&&gap<=(dy<=40?80:60)):gap<=90};
 const seen=new Set(),q=[sf.find(s=>s.x0<=70&&s.x1>=70&&s.y==GY)];seen.add(q[0]);while(q.length){const a=q.pop();sf.forEach(c=>{if(!seen.has(c)&&can(a,c)){seen.add(c);q.push(c)}})}
 const rs=[...seen],on=(x,y,tol)=>rs.some(s=>x>=s.x0-12&&x<=s.x1+12&&s.y-y>=-6&&s.y-y<=tol);
 (B.it||[]).forEach(i=>{if(!on(i.x,i.y,125))bad.push('item inalcançável '+i.x+','+i.y)});if(!on(B.gx||B.w-80,B.gy||GY,60))bad.push('portal de saída inalcançável');
 if(B.pads)B.pads.forEach(([x,u,w],i)=>{if(!on(x+w/2,GY-u,20))bad.push('bloco '+i+' inalcançável')});if(B.npc&&!on(B.npc.x,GY,20))bad.push('NPC inalcançável');return bad}
